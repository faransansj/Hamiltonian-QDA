version: 1.2.0
artifact_unit: one directory per logical synthetic output
state_file:
  filename: state.npy
  format: NumPy NPY 1.0
  shape: [16]
  axis_semantics: index is canonical lexicographic binary basis index 0000..1111
  dtype: <c16
  byte_order: little_endian
  complex_representation: IEEE-754 float64 real followed by float64 imaginary per element
  memory_order: C_contiguous
  allow_pickle: false
  header_dict_exact: "{'descr': '<c16', 'fortran_order': False, 'shape': (16,), }"
  header_encoding: latin1
  header_termination: newline
  header_alignment: NPY_1_0_64_byte_alignment
provenance_file:
  filename: provenance.json
  encoding: UTF-8
  canonicalization: keys sorted lexicographically; separators comma and colon with no whitespace; ensure_ascii false; exactly one trailing LF
  required_fields:
    - synthetic_id
    - arm
    - realization
    - class
    - source_state_id
    - source_state_index
    - source_g
    - source_label
    - source_position
    - proposal_seed_payload
    - proposal_seed_sha256
    - proposal_seed_uint128_decimal
    - accepted_attempt
    - target_g
    - FS_displacement
    - generation_method
    - protocol_version
    - protocol_hash
    - parent_protocol_hash
    - p1_freeze_hash
    - state_hash
    - state_file_sha256
    - validation
  C1_target_g: null
  state_hash: SHA-256 of canonical <c16 state payload bytes, excluding NPY header
row_order:
  aggregate_logical_order: C2 then C1; D00..D11; class 0 then 1; frozen P1 source positions 0..49
  per_output_serialized_row_index: 0
expected_counts:
  per_arm: 1200
  per_arm_per_realization: 100
  per_arm_per_realization_per_class: 50
  total: 2400
replay:
  state_field:
    mode: NUMERICAL_TOLERANCE
    shape_and_dtype: exact
    atol: 1.0e-10
    rtol: 0.0
    nan_semantics: forbidden_in_either_artifact
    complex_semantics: for each canonicalized complex component require abs(expected[i] - actual[i]) <= atol + rtol*abs(expected[i])
    executable_API: numpy.allclose(expected, actual, atol=1e-10, rtol=0.0, equal_nan=False) after exact shape/dtype/finite checks
    canonicalization_precondition: both artifacts must already pass the inherited TFIM global-phase rule; replay comparison does not recanonicalize
    reason: matches the inherited maximum eigenpair residual tolerance; no looser tolerance is introduced
  provenance_fields:
    mode: CANONICAL_EXACT
    comparison: parsed canonical JSON values exactly equal
  canonical_provenance_bytes:
    mode: BYTE_IDENTICAL
  frozen_state_and_provenance_files:
    mode: BYTE_IDENTICAL
    comparison: SHA-256 equality to materialization manifest

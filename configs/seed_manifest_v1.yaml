version: 1.0.0
immutable: true
rng: numpy.random.Generator
bit_generator: PCG64DXSM
seed_derivation: "SHA-256 UTF-8 canonical JSON array [domain, base_seed, identifiers]; first 16 hex digits interpreted as unsigned 64-bit integer"
base_seeds:
  dataset_generation: 11001
  split_construction: 12001
  source_assignment: 13001
  c1_generic_perturbation: 21001
  c2_target_proposal: 22001
  bootstrap: 51001
qcnn:
  initialization_seeds: [31001, 31002, 31003]
  optimizer_seeds: [41001, 41002, 41003]
realizations:
  count: 12
  ids: [D00, D01, D02, D03, D04, D05, D06, D07, D08, D09, D10, D11]
  source_assignment_derivation: [source_assignment, 13001, realization_id, class_label]
per_source_domains:
  c1: [C1-v1, 21001, realization_id, source_state_id, attempt_index]
  c2: [C2-v1, 22001, realization_id, source_state_id, attempt_index]
bootstrap_domain: [bootstrap-v1, 51001]
replacement_policy: forbidden_due_to_failure_or_result
